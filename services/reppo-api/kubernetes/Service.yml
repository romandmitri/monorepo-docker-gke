apiVersion: v1
kind: Service
metadata:
  name: reppo-api
  annotations:
    cloud.google.com/backend-config: '{"default": "reppo-backend-config"}'
spec:
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
  selector:
    app: reppo-api
  # https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: NodePort
